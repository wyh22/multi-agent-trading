[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "1.4.0"
description = "基于 TradingAgents 二次开发的 A 股多智能体智能投研与候选发现系统"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "wyh22"},
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-aws>=0.2.0",
    "langsmith>=0.1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "akshare>=1.14.0",
    "baostock>=0.9.3",
    "requests>=2.31",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "typing_extensions>=4.9",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "stockstats>=0.6",
    "questionary>=2.0",
    "typer>=0.12",
    "langgraph-checkpoint-sqlite>=2.0",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
eval = ["pytest>=8.0", "pytest-asyncio>=0.23"]
quant = ["lightgbm>=4.0,<5"]
agent = [
    "mcp[cli]>=1.24,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "qdrant-client>=1.15,<2",
    "fastembed>=0.7,<1",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/wyh22/multi-agent-trading"
Documentation = "https://github.com/wyh22/multi-agent-trading#readme"
Issues = "https://github.com/wyh22/multi-agent-trading/issues"
Upstream = "https://github.com/TauricResearch/TradingAgents"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]
exclude = ["tests*", "evaluation*"]

[tool.setuptools.package-data]
"tradingagents.skills" = ["manifests/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
