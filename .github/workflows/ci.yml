name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,dev]"

      - name: Compile
        run: python -m compileall -q tradingagents service scripts

      - name: Import smoke tests
        run: |
          python -c "from service.app import app; assert app.title"
          python -c "import tradingagents.mcp.server"
          python -c "from tradingagents.discovery import DiscoveryCoordinatorAgent"
          python -c "from tradingagents.evaluation import AgentEvalDataset"
          python -c "from tradingagents.backtest import BacktestRunner"
          python -m cli.main --help > /dev/null

      - name: Test
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t multi-agent-trading:ci .
